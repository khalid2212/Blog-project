<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Simple FastAPI Blog"><title>Create account | My Blog</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header><nav class="nav"><a class="logo" href="/">My<span>Blog.</span></a><div id="navlinks" class="navlinks"></div></nav></header><main class="container"><div class="panel narrow"><h1>Create your account</h1><p class="muted">Join the blog and start publishing.</p><div id="message" class="notice hidden"></div><form id="form"><label for="name">Name</label><input id="name" name="name" minlength="2" maxlength="80" required autocomplete="name"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button type="submit">Create account</button></form><p>Already registered? <a href="/login.html">Log in</a></p></div></main><footer>My Blog · Built with FastAPI + Vanilla JavaScript</footer><script src="/static/js/common.js"></script><script src="/static/js/register.js"></script></body></html>
